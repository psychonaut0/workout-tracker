name: app-ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  analyze-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable

      # Calls flutter directly (no fvm on this runner; flutter-action already
      # pins the right version onto PATH). The never-run-flutter-directly rule
      # is for local dev, where fvm is how the Makefile resolves the pin.
      - name: Install dependencies
        working-directory: app
        run: flutter pub get

      - name: Analyze
        working-directory: app
        run: flutter analyze

      - name: Test
        working-directory: app
        run: flutter test
